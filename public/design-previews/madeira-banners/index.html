<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Варіанти банерів Мадейри</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#183434;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:30px}h2{margin-top:44px}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:#235e50}figure{margin:24px 0;background:white;padding:12px;border-radius:16px;box-shadow:0 3px 16px #173d2b10}img{display:block;width:100%;height:auto;border-radius:9px}figcaption{font-weight:650;padding:12px 4px 2px}.note{color:#52655b;max-width:850px}button{background:#235e50;color:white;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}.compact img{height:200px;object-fit:cover;object-position:center}button:focus-visible,a:focus-visible{outline:3px solid #b05f38;outline-offset:3px}@media(max-width:600px){main{padding:20px 12px}.compact img{height:210px}h1{font-size:26px}}
</style></head><body><main><h1>Банери в єдиному стилі</h1><p class="note">Три варіанти для кожного розділу. Це ілюстрації для вибору; текст сторінок буде накладено окремо. Мапи декоративні — розташування іконок не призначене для навігації.</p><nav><a href="#sunrise">Схід сонця</a><a href="#planner">План подорожі</a><a href="#locations">Локації</a><a href="#trail">Маршрути</a></nav><p><button id="crop" type="button" aria-pressed="false">Показати в компактній рамці</button></p>
<section id="sunrise"><h2>Схід сонця</h2><figure><img src="sunrise-1.jpg" alt="Варіант С1: радар на тлі світанку"><figcaption>С1 — Радар і море хмар</figcaption></figure><figure><img src="sunrise-2.jpg" alt="Варіант С2: радар на гірському хребті"><figcaption>С2 — Вид уздовж хребта</figcaption></figure><figure><img src="sunrise-3.jpg" alt="Варіант С3: панорама вершини"><figcaption>С3 — Панорама з сусідньої вершини</figcaption></figure></section>
<section id="planner"><h2>План подорожі</h2><figure><img src="planner-1.jpg" alt="Варіант П1: двоє туристів з мапою"><figcaption>П1 — Туристи на оглядовому майданчику</figcaption></figure><figure><img src="planner-2.jpg" alt="Варіант П2: планування біля кам’яного парапету"><figcaption>П2 — Мапа на кам’яному парапеті</figcaption></figure><figure><img src="planner-3.jpg" alt="Варіант П3: туристи й рельєфна мапа"><figcaption>П3 — Мандрівники й маршрут островом</figcaption></figure></section>
<section id="locations"><h2>Локації</h2><figure><img src="locations-1.jpg" alt="Варіант Л1: рельєфна мапа з пам’ятками"><figcaption>Л1 — Рельєф острова й мініатюри пам’яток</figcaption></figure><figure><img src="locations-2.jpg" alt="Варіант Л2: мапа острова згори"><figcaption>Л2 — Мапа згори з позначками</figcaption></figure><figure><img src="locations-3.jpg" alt="Варіант Л3: острів із круглими іконками"><figcaption>Л3 — Мапа з іконками локацій</figcaption></figure></section>
<section id="trail"><h2>Маршрути — ширший ракурс</h2><figure><img src="trail-wide.jpg" alt="Гірська стежка з туристами у ширшому ракурсі"><figcaption>Менший масштаб людей, більше гір і стежки</figcaption></figure></section>
<script>document.getElementById('crop').addEventListener('click',function(){const on=document.body.classList.toggle('compact');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Показати повні зображення':'Показати в компактній рамці';});</script></main></body></html>
