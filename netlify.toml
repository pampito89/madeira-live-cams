[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Next.js runtime does not support next.config.mjs rewrites pointing
# to static files in public/. Serve optimized WebP files at the CDN edge.

[[redirects]]
  from = "/images/cameras/madeira-camera-2.png"
  to = "/images/optimized/cameras/madeira-camera-2-a573d51ae4-711.webp"
  status = 200
  force = true

